spring.application.name=mypersonalassist
server.port=${SERVER_PORT:8080}

# Local MySQL stores users, preferences, command history, upload metadata, and batch job state.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/mypersonalassist?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=rootroot
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.thymeleaf.check-template-location=false

# File upload limits for RAG source documents.
spring.servlet.multipart.max-file-size=${ASSISTANT_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${ASSISTANT_MAX_REQUEST_SIZE:100MB}

# Local-first model routing. Cloud Gemini is intended for opt-in complex or web-grounded work.
assistant.llm.default-provider=${ASSISTANT_LLM_DEFAULT:local}
assistant.llm.local.provider=ollama
assistant.llm.cloud.provider=gemini
assistant.llm.cloud.api-key-env=GEMINI_AI_KEY

# Ollama local Llama chat and local embeddings.
langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=${OLLAMA_CHAT_MODEL:llama3.1:8B}
langchain4j.ollama.chat-model.temperature=${OLLAMA_TEMPERATURE:0.2}
langchain4j.ollama.chat-model.timeout=${OLLAMA_TIMEOUT:120s}
langchain4j.ollama.embedding-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.embedding-model.model-name=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
langchain4j.ollama.embedding-model.timeout=${OLLAMA_EMBEDDING_TIMEOUT:120s}

# Gemini settings used when GEMINI_AI_KEY is configured and cloud routing is selected.
assistant.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
assistant.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
assistant.gemini.embedding-output-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}

# Qdrant is the local vector database for uploaded RAG files.
assistant.vector-store.provider=qdrant
assistant.qdrant.host=${QDRANT_HOST:localhost}
assistant.qdrant.grpc-port=${QDRANT_GRPC_PORT:6334}
assistant.qdrant.http-port=${QDRANT_HTTP_PORT:6333}
assistant.qdrant.collection=${QDRANT_COLLECTION:personal_assist_rag}
assistant.qdrant.embedding-dimensions=${QDRANT_EMBEDDING_DIMENSIONS:768}

# RAG ingestion is intentionally batched to respect local hardware and cloud embedding limits.
assistant.rag.upload-dir=${ASSISTANT_UPLOAD_DIR:${user.home}/.mypersonalassist/uploads}
assistant.rag.allowed-content-types=application/pdf,text/plain,text/markdown
assistant.rag.chunk-size=${RAG_CHUNK_SIZE:800}
assistant.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:120}
assistant.rag.embedding-batch-size=${RAG_EMBEDDING_BATCH_SIZE:50}
assistant.rag.embedding-batch-delay=${RAG_EMBEDDING_BATCH_DELAY:2s}
assistant.rag.max-parallel-files=${RAG_MAX_PARALLEL_FILES:2}

# Native utilities invoked by the Java app for voice and desktop automation.
assistant.voice.stt.provider=${ASSISTANT_STT_PROVIDER:whisper-cpp}
assistant.voice.stt.command=${ASSISTANT_STT_COMMAND:whisper-cli}
assistant.voice.tts.provider=${ASSISTANT_TTS_PROVIDER:piper}
assistant.voice.tts.command=${ASSISTANT_TTS_COMMAND:piper}
assistant.desktop.command-timeout=${ASSISTANT_DESKTOP_COMMAND_TIMEOUT:10s}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
