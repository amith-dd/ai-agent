services:
  mysql:
    image: mysql:8.4
    container_name: mypersonalassist-mysql
    environment:
      MYSQL_DATABASE: mypersonalassist
      MYSQL_USER: mypa
      MYSQL_PASSWORD: mypa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umypa", "-pmypa"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mypersonalassist-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  qdrant-data:
